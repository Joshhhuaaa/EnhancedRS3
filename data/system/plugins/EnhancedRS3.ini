[General]
SkipIntro = 0                        // Skips the intro logos.
FPSLimit = -1                        // Caps the frame rate. 0 is uncapped, -1 sits just under the refresh rate.
LocalDirectSound = 1                 // Loads dsound.dll from the game folder rather than the system copy, so ALchemy/DSOAL work without a registry edit.

[Graphics]
DisplayMode = 0                      // 0 exclusive fullscreen, 1 borderless at the desktop resolution, 2 windowed.
StretchMenus = 0                     // Stretches the menus to fill the screen instead of pillarboxing them to 4:3.
FieldOfView = 1                      // 0 stock, 1 auto-detects from the aspect ratio, or a horizontal FOV to force (65-140).
AnisotropicFiltering = 16            // Forces anisotropic texture filtering. 0 or 1 is off, up to 16.
MSAA = 0                             // Forces multisample antialiasing. 0 or 1 is off, up to 8 samples.
SMAA = 0                             // Enables subpixel morphological antialiasing to smooth jagged edges.

[HUD]
CenterOptics = 1                     // Centers the optics view, which Ubisoft left slightly off.
HideCrosshairWhenZoomed = 0          // Hides the crosshair inside a scope. 1 drops the center dot and keeps the accuracy ticks, 2 hides all of it.

[Input]
LookSensitivity = 1.0                // Multiplier on top of the in-game mouse sensitivity slider.
CursorSensitivity = 1.0              // Multiplier on top of the menu mouse cursor sensitivity.