[General]
SkipIntro = 0                        // Skips the intro logos.
WidescreenHUD = 1                    // Scales the HUD, reticles and scope overlay for widescreen.
HUDScale = 1                         // Scales the crosshair and message text up with resolution.
LookSensitivity = 1.0                // Multiplier on top of the in-game mouse sensitivity slider.
CursorSensitivity = 1.0              // Multiplier on top of the menu mouse cursor sensitivity.
AnisotropicFiltering = 16            // Forces anisotropic texture filtering. 0 or 1 is off, up to 16.
SMAA = 1                             // Enables SMAA to smooth jagged edges.
